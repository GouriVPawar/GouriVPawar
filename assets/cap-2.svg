<svg xmlns="http://www.w3.org/2000/svg" width="322" height="242" viewBox="0 0 322 242" role="img" aria-labelledby="t d">
<title id="t">Agentic AI — Tool-using agents that plan, call functions and return structured, verifiable outputs.</title>
<desc id="d">Agentic AI — Tool-using agents that plan, call functions and return structured, verifiable outputs.</desc>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B9CFF"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2A3A52"/><stop offset="1" stop-color="#2A3A52" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#8B9CFF" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,Menlo,'Courier New',monospace;}

.blink{animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.dash{stroke-dasharray:4 8;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.tw{opacity:.1;animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.08}50%{opacity:.55}}
.nudge{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.spin{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sh{animation:sh 7s linear infinite}
@keyframes sh{from{transform:translateX(0)}to{transform:translateX(462px)}}

</style>
<rect x="0.5" y="0.5" width="321" height="241" rx="16" fill="#0E1520" stroke="#1F2B3D"/>
<defs><clipPath id="cc"><rect width="322" height="242" rx="16"/></clipPath></defs><g clip-path="url(#cc)"><rect x="0" y="0" width="322" height="2" fill="url(#acc)" opacity="0.22"/><rect class="sh" x="-140" y="0" width="140" height="2" fill="url(#shg)" style="animation-delay:-2.8s"/></g>
<rect x="18.5" y="20.5" width="59" height="59" rx="15" fill="#131C2A" stroke="#2A3A52"/>
<g transform="translate(24,26)"><g class="spin fb"><rect width="48" height="48" fill="none"/><g fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 9 A15 15 0 1 1 9 24"/><path d="M5 29 L9 24 L13 29"/></g></g><circle class="blink" cx="24" cy="24" r="3.6" fill="#2DD4BF"/></g>
<text class="m" x="302" y="38" font-size="12" letter-spacing="2" text-anchor="end" fill="#5F6D82">02</text>
<text class="m" x="302" y="58" font-size="11" letter-spacing="1.5" text-anchor="end" fill="#2DD4BF">AUTONOMY</text>
<text x="20" y="112" font-size="19" font-weight="700" fill="#E8EEF8">Agentic AI</text>
<text x="20" y="136" font-size="13.5" fill="#95A3B8">Tool-using agents that plan, call</text>
<text x="20" y="154" font-size="13.5" fill="#95A3B8">functions and return structured,</text>
<text x="20" y="172" font-size="13.5" fill="#95A3B8">verifiable outputs.</text>
