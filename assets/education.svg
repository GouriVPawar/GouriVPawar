<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="146" viewBox="0 0 1000 146" role="img" aria-labelledby="t d">
<title id="t">Education and leadership</title>
<desc id="d">B.E. Computer Science Engineering, University of Mumbai, 2023, CGPA 8.92/10. Team Lead of the International V2X Research Project (Symbiosis Institute of Technology, University of Belgrade, University of Kragujevac). Co-Lead of the Google Developer Student Club (GDSC).</desc>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B9CFF"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2A3A52"/><stop offset="1" stop-color="#2A3A52" stop-opacity="0"/>
  </linearGradient>
