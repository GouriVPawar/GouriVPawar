<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="t d">
<title id="t">Experience</title>
<desc id="d">Experience. PedTech Global, Software Engineer · CDLC.CLUB, an AI and robotics learning product, Aug 2026 – Sep 2026, Dubai, UAE. Built and shipped core features on the CDLC.CLUB platform team for PedTech Global's AI and robotics learning product. Turned founder-built AI products into structured, project-based learning paths, making complex AI/ML systems understandable to end users. Lab of Future, Software Engineer &amp; Researcher, May 2024 – Jul 2026, Jaipur &amp; Dubai. Built and shipped LOF Chatbot, a production RAG system covering document ingestion and chunking, embeddings, vector search retrieval and LLM prompt design, served via FastAPI and cutting manual query resolution by ~60%. Owned AI services end to end: Python microservices (FastAPI/Flask) and REST APIs for LLM, model and retrieval serving, supporting concurrent users through WebSocket event streaming. Engineered Lab of Future Studio, a multi-module simulation platform (coding, drone, robotics, space), and LOF Community App, a real-time WebSocket platform for live discussions and user channels. TinkerXLabs, Full Stack Developer, Sep 2023 – Apr 2024, Mumbai, India. Delivered a Point of Sale system end to end: inventory, billing, Razorpay webhook payments and a sales analytics dashboard. Implemented a MySQL InnoDB Cluster for high availability, achieving zero downtime for billing operations. ONE STOP, Machine Learning Intern, Jun 2021 – Aug 2021, Mumbai, India. Delivered 3 supervised ML models (disease prediction, spam filtering, malware classification) with scikit-learn, each achieving 90%+ accuracy. Served the models through a Django + PostgreSQL REST API backend for real-time inference.</desc>
