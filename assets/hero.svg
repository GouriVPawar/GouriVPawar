<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d">
<title id="t">Gouri Pawar — AI Engineer</title>
<desc id="d">Gouri Pawar. AI Engineer building intelligent systems that hold up in production: GenAI, RAG and backend engineering. Animated pipeline: ingest, chunk, embed, retrieve, generate.</desc>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B9CFF"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2A3A52"/><stop offset="1" stop-color="#2A3A52" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,Menlo,'Courier New',monospace;}

.ring{opacity:.35;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%{opacity:.35}3%{opacity:1}12%{opacity:.35}100%{opacity:.35}}
.pkt{opacity:0;animation:travel 6s linear infinite}
@keyframes travel{0%{transform:translateX(0);opacity:0}3%{opacity:1}77%{opacity:1}80%{transform:translateX(780px);opacity:0}100%{transform:translateX(780px);opacity:0}}
.flow{stroke-dasharray:4 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.ring,.pkt,.flow,.blink{animation:none}}

</style>

<defs>
  <clipPath id="clip"><rect width="1000" height="430" rx="20"/></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#111A28" stroke-width="1"/>
  </pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#090D14"/><stop offset="1" stop-color="#0C1320"/>
  </linearGradient>
  <radialGradient id="g1" cx="0.88" cy="0.05" r="0.6">
    <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.20"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2" cx="0.05" cy="1" r="0.55">
    <stop offset="0" stop-color="#8B9CFF" stop-opacity="0.16"/><stop offset="1" stop-color="#8B9CFF" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="430" fill="url(#bg)"/>
  <rect width="1000" height="430" fill="url(#grid)"/>
  <rect width="1000" height="430" fill="url(#g1)"/>
  <rect width="1000" height="430" fill="url(#g2)"/>
</g>
<rect x="0.5" y="0.5" width="999" height="429" rx="20" fill="none" stroke="#1F2B3D"/>

<circle class="blink" cx="46" cy="68" r="4" fill="#2DD4BF"/>
