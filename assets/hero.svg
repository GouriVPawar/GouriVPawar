<circle class="blink" cx="46" cy="68" r="4" fill="#2DD4BF"/>
<text class="m" x="62" y="73" font-size="12.5" font-weight="700" letter-spacing="2" fill="#2DD4BF">AI ENGINEER<tspan dx="12" fill="#5F6D82" font-weight="400">/</tspan><tspan dx="12" fill="#95A3B8" font-weight="400">GENAI · AGENTS · RESEARCH</tspan></text>
<text x="40" y="148" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#E8EEF8">Gouri Pawar</text>
