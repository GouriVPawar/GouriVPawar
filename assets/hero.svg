<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="t d">
<title id="t">Gouri Pawar — AI Engineer</title>
<desc id="d">Gouri Pawar, AI Engineer. From retrieval pipelines to multi-agent workflows: AI that holds up in production. Animated diagram of an orchestrator coordinating retriever, tool-use, vision and evaluator agents.</desc>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B9CFF"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2A3A52"/><stop offset="1" stop-color="#2A3A52" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#8B9CFF" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,Menlo,'Courier New',monospace;}

.blink{animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.dash{stroke-dasharray:4 8;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.tw{opacity:.1;animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.08}50%{opacity:.55}}
.nudge{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.hubring{opacity:.4;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
.glow{opacity:.14;animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.10}50%{opacity:.24}}
.pk{opacity:0}
.ar{opacity:.3}
@keyframes pk0{0%{transform:translate(0,0);opacity:0}1%{transform:translate(0,0);opacity:1}8%{transform:translate(-130px,-96px);opacity:1}12%{transform:translate(-130px,-96px);opacity:1}19%{transform:translate(0,0);opacity:1}21%{transform:translate(0,0);opacity:0}100%{transform:translate(0,0);opacity:0}}

.pk0{animation:pk0 8s linear infinite}
@keyframes ar0{0%{opacity:.3}8%{opacity:1}13%{opacity:1}22%{opacity:.3}100%{opacity:.3}}

.ar0{animation:ar0 8s ease-in-out infinite}
@keyframes pk1{0%{transform:translate(0,0);opacity:0}25%{transform:translate(0,0);opacity:0}26%{transform:translate(0,0);opacity:1}33%{transform:translate(130px,-96px);opacity:1}37%{transform:translate(130px,-96px);opacity:1}44%{transform:translate(0,0);opacity:1}46%{transform:translate(0,0);opacity:0}100%{transform:translate(0,0);opacity:0}}

.pk1{animation:pk1 8s linear infinite}
@keyframes ar1{0%{opacity:.3}31%{opacity:.3}33%{opacity:1}38%{opacity:1}47%{opacity:.3}100%{opacity:.3}}

.ar1{animation:ar1 8s ease-in-out infinite}
@keyframes pk2{0%{transform:translate(0,0);opacity:0}50%{transform:translate(0,0);opacity:0}51%{transform:translate(0,0);opacity:1}58%{transform:translate(-130px,96px);opacity:1}62%{transform:translate(-130px,96px);opacity:1}69%{transform:translate(0,0);opacity:1}71%{transform:translate(0,0);opacity:0}100%{transform:translate(0,0);opacity:0}}

.pk2{animation:pk2 8s linear infinite}
@keyframes ar2{0%{opacity:.3}56%{opacity:.3}58%{opacity:1}63%{opacity:1}72%{opacity:.3}100%{opacity:.3}}

.ar2{animation:ar2 8s ease-in-out infinite}
@keyframes pk3{0%{transform:translate(0,0);opacity:0}75%{transform:translate(0,0);opacity:0}76%{transform:translate(0,0);opacity:1}83%{transform:translate(130px,96px);opacity:1}87%{transform:translate(130px,96px);opacity:1}94%{transform:translate(0,0);opacity:1}96%{transform:translate(0,0);opacity:0}100%{transform:translate(0,0);opacity:0}}

.pk3{animation:pk3 8s linear infinite}
@keyframes ar3{0%{opacity:.3}81%{opacity:.3}83%{opacity:1}88%{opacity:1}97%{opacity:.3}100%{opacity:.3}}

.ar3{animation:ar3 8s ease-in-out infinite}
</style>

<defs>
  <clipPath id="clip"><rect width="1000" height="460" rx="20"/></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#111A28" stroke-width="1"/>
  </pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#090D14"/><stop offset="1" stop-color="#0C1320"/>
  </linearGradient>
  <radialGradient id="g1" cx="0.85" cy="0.1" r="0.6">
    <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.18"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="hg" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2" cx="0.05" cy="1" r="0.55">
    <stop offset="0" stop-color="#8B9CFF" stop-opacity="0.16"/><stop offset="1" stop-color="#8B9CFF" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#clip)">
  <rect width="1000" height="460" fill="url(#bg)"/>
  <rect width="1000" height="460" fill="url(#grid)"/>
  <rect width="1000" height="460" fill="url(#g1)"/>
  <rect width="1000" height="460" fill="url(#g2)"/>
</g>
<rect x="0.5" y="0.5" width="999" height="459" rx="20" fill="none" stroke="#1F2B3D"/>

