<text x="40" y="214" font-size="22" fill="#95A3B8">From retrieval pipelines to</text>
<text x="40" y="244" font-size="22" fill="#95A3B8">multi-agent workflows: AI that</text>
<text x="40" y="274" font-size="22" fill="#95A3B8">holds up in production.</text>
<rect x="40" y="318" width="420" height="1.5" fill="url(#fade)"/>
