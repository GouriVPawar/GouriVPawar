<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="381" viewBox="0 0 1000 381" role="img" aria-labelledby="t d">
<title id="t">Profile overview</title>
<desc id="d">Profile. AI Engineer with 3+ years taking GenAI and LLM solutions from problem to production: scoping the need, prototyping quickly and deploying RAG systems, FastAPI/Flask AI services and React interfaces that real users depend on. Strong across the full stack, comfortable in ambiguous problem spaces, and experienced in turning complex AI systems into clear learning content for users. Open to: AI Engineer, Forward Deployed Engineer, Full-Stack Engineer. 3+ years shipping GenAI, LLM and full-stack systems; about 60% less manual query resolution with the LOF Chatbot; led a 3-university international research team; 8.92 CGPA, B.E. Computer Science, University of Mumbai.</desc>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B9CFF"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2A3A52"/><stop offset="1" stop-color="#2A3A52" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#8B9CFF" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,Menlo,'Courier New',monospace;}

.blink{animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.dash{stroke-dasharray:4 8;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.tw{opacity:.1;animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.08}50%{opacity:.55}}
.nudge{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.sh{animation:sh 7s linear infinite}
@keyframes sh{from{transform:translateX(0)}to{transform:translateX(1140px)}}

</style>
