<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d">
<title id="t">Technical toolkit</title>
<desc id="d">Toolkit. Genai &amp; Agents: LLM integration, OpenAI APIs, Hugging Face, Prompt engineering, Context engineering, Structured outputs, Function calling, LangChain, LangGraph, MCP. Rag &amp; Retrieval: RAG pipelines, Embeddings, Semantic search, Document chunking, Vector search, pgvector, ChromaDB. Ml &amp; Deep Learning: CNN/RNN, Deep learning, Computer vision, Scikit-learn, Pandas, Fuzzy logic, Feature engineering. Backend &amp; Apis: FastAPI, Flask, Django, Node.js, Express, REST APIs, Microservices, Pydantic, Async, WebSockets. Data &amp; Messaging: PostgreSQL, MySQL, MongoDB, Redis, RabbitMQ, Firebase, Caching. Frontend: React.js, Redux, HTML5, CSS3, Tailwind CSS, Responsive UI. Devops &amp; Edge: Git, GitHub, Docker, Kubernetes, CI/CD, Cloud deployment, Linux, Raspberry Pi, Arduino, MQTT, LoRaWAN. Languages: Python (primary), SQL, JavaScript (ES6+), Java.</desc>
<defs>
