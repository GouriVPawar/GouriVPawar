<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="387" viewBox="0 0 1000 387" role="img" aria-labelledby="t d">
<title id="t">Technical toolkit</title>
<desc id="d">Toolkit. Genai &amp; Llms: OpenAI APIs, LangChain, LangGraph, Hugging Face, Prompt engineering, Structured outputs, Function calling, AI agents, MCP. Deep Learning &amp; Ml: CNNs, RNNs, Computer vision, scikit-learn, Pandas, Fuzzy logic. Backend &amp; Apis: Python, FastAPI, Flask, Django, Node.js, Express, REST, Pydantic, Async, WebSockets. Data &amp; Retrieval: PostgreSQL, pgvector, ChromaDB, MongoDB, MySQL, Redis, RabbitMQ, Firebase. Frontend: React, Redux, TypeScript, JavaScript, Tailwind CSS. Infra &amp; Edge: Docker, Kubernetes, Linux, CI/CD, MQTT, Raspberry Pi, Arduino, LoRaWAN.</desc>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B9CFF"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2A3A52"/><stop offset="1" stop-color="#2A3A52" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#8B9CFF" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
