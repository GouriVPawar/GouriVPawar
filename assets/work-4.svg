<svg xmlns="http://www.w3.org/2000/svg" width="490" height="218" viewBox="0 0 490 218" role="img" aria-labelledby="t d">
<title id="t">Point of Sale — Full-stack inventory, billing and analytics platform with Razorpay payment webhooks.</title>
<desc id="d">Point of Sale — Full-stack inventory, billing and analytics platform with Razorpay payment webhooks.</desc>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B9CFF"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2A3A52"/><stop offset="1" stop-color="#2A3A52" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#8B9CFF" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;}
.m{font-family:'SF Mono','JetBrains Mono',Consolas,Menlo,'Courier New',monospace;}

.blink{animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.dash{stroke-dasharray:4 8;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.tw{opacity:.1;animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.08}50%{opacity:.55}}
.nudge{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.fb{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.bar{transform-origin:bottom;animation:bar 3.6s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.72)}}
.sh{animation:sh 7s linear infinite}
@keyframes sh{from{transform:translateX(0)}to{transform:translateX(630px)}}

</style>
<rect x="0.5" y="0.5" width="489" height="217" rx="16" fill="#0E1520" stroke="#1F2B3D"/>
<defs><clipPath id="cc"><rect width="490" height="218" rx="16"/></clipPath></defs><g clip-path="url(#cc)"><rect x="0" y="0" width="490" height="2" fill="url(#acc)" opacity="0.22"/><rect class="sh" x="-140" y="0" width="140" height="2" fill="url(#shg)" style="animation-delay:-6.8s"/></g>
<g transform="translate(424,26)" stroke="#2DD4BF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect class="bar fb" style="animation-delay:0s" x="0" y="22" width="9" height="16" rx="2"/><rect class="bar fb" style="animation-delay:.4s" x="15" y="12" width="9" height="26" rx="2"/><rect class="bar fb" style="animation-delay:.8s" x="30" y="0" width="9" height="38" rx="2" fill="#2DD4BF"/></g>
